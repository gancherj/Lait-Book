[book]
title = "Lait Book"
authors = ["gancherj"]
language = "en"

# Runs every ```lean block through the Lean language server for highlighting,
# hovers and diagnostics.
[preprocessor.leandown]
command = "./node_modules/.bin/mdbook-leandown"
# Elaborate code blocks inside the Lait Lean project at the repo root (path is
# relative to this file) so blocks can `import Lait`. Run `lake build Lait`
# there before building the book — imports resolve against build artifacts.
# Without this, blocks are checked in an empty scratch project, `import Lait`
# fails, and the whole chapter comes out with no hovers.
lean-project-path = "../leansrc/"

[output.html]
additional-js = ["./node_modules/@leandown/mdbook/dist/index.js"]
# leandown-overrides.css must stay last: it relies on being loaded after
# leandown's own stylesheet so equal-specificity rules win.
additional-css = [
  "./node_modules/@leandown/mdbook/dist/leandown.css",
  "./leandown-overrides.css",
]
